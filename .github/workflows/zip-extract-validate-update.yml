name: XORA production source validation and ZIP import
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xora-production-import-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    name: Validate source, tests, types and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      has_archives: ${{ steps.prepare.outputs.has_archives }}
      manifest_sha256: ${{ steps.prepare.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bootstrap trusted importer (independent of uploaded ZIP)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_BOOTSTRAP'
          import base64, lzma, hashlib, os
          from pathlib import Path
          source = lzma.decompress(base64.b64decode("""
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          vCl+phmvUosNvYK861syd6phcnW0HkCMl7FhCdIPBfY0MYisPSKvH/mP84l1A75mm9fHalDhg7L6z5X0ZzkpuIXoioTsyegkqvQPP0gAAACsMcjV6m5GZQABiibYdgAAU7xjgbHEZ/sCAAAAAARZWg==
          """))
          if hashlib.sha256(source).hexdigest() != "33b6c7a45da1b5817994e1d40a731e00bb3972a7dabafe6a2640f5b0e19af414":
              raise SystemExit('Trusted importer checksum mismatch')
          Path(os.environ['RUNNER_TEMP'], 'xora-importer.py').write_bytes(source)
          PY_BOOTSTRAP
      - name: Prepare source and record immutable manifest
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/xora-importer.py" --root . --stage .xora-import
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          data = Path('.xora-import/manifest.json').read_bytes()
          manifest = json.loads(data)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print('has_archives=' + str(bool(manifest['archives'])).lower(), file=out)
              print('manifest_sha256=' + hashlib.sha256(data).hexdigest(), file=out)
          PY
      - name: Python tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Unit and source-boundary tests
        run: |
          set -euo pipefail
          npm test
          npm run verify:boundaries
      - name: Install dependencies without production credentials
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --include=dev --no-audit --no-fund
          else
            echo '::warning::No committed lockfile; dependency resolution is not reproducible yet.'
            npm install --include=dev --no-audit --no-fund
          fi
      - name: Syntax, production build and type verification
        env:
          XORA_ENVIRONMENT: production
          XORA_AUTH_ENABLED: 'false'
          XORA_SIGNUP_ENABLED: 'false'
          XORA_PUBLIC_LAUNCH: 'false'
          XORA_MOMO_PAYMENTS: 'false'
          XORA_TEST_ENDPOINTS: 'false'
        run: |
          set -euo pipefail
          npm run verify:syntax
          npm run build
          npm run typecheck
  commit:
    name: Commit validated source and remove only processed archives
    needs: validate
    if: >-
      needs.validate.outputs.has_archives == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Bootstrap trusted importer (never execute uploaded code here)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY_BOOTSTRAP'
          import base64, lzma, hashlib, os
          from pathlib import Path
          source = lzma.decompress(base64.b64decode("""
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          vCl+phmvUosNvYK861syd6phcnW0HkCMl7FhCdIPBfY0MYisPSKvH/mP84l1A75mm9fHalDhg7L6z5X0ZzkpuIXoioTsyegkqvQPP0gAAACsMcjV6m5GZQABiibYdgAAU7xjgbHEZ/sCAAAAAARZWg==
          """))
          if hashlib.sha256(source).hexdigest() != "33b6c7a45da1b5817994e1d40a731e00bb3972a7dabafe6a2640f5b0e19af414":
              raise SystemExit('Trusted importer checksum mismatch')
          Path(os.environ['RUNNER_TEMP'], 'xora-importer.py').write_bytes(source)
          PY_BOOTSTRAP
      - name: Verify identical extraction and commit atomically
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_MANIFEST: ${{ needs.validate.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          git fetch origin main
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_COMMIT" ]]
          [[ "$(git rev-parse FETCH_HEAD)" == "$EXPECTED_COMMIT" ]]
          python "$RUNNER_TEMP/xora-importer.py" --root . --stage .xora-import
          [[ "$(sha256sum .xora-import/manifest.json | cut -d' ' -f1)" == "$EXPECTED_MANIFEST" ]]
          python "$RUNNER_TEMP/xora-importer.py" --root . --stage .xora-import --apply
          if git diff --cached --quiet; then
            echo 'Nothing changed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null commit -m 'chore: import validated XORA source and remove processed archives'
          git push origin HEAD:refs/heads/main
          
