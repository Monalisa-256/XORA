name: XORA - validate repository, build and refresh ZIPs

on:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/normalized/**'
      - 'dist/reports/**'
  pull_request:
  workflow_dispatch:
    inputs:
      archive:
        description: 'Optional path to any ZIP file; blank validates every ZIP separately'
        required: false
        type: string
        default: ''
      commit_updated_zips:
        description: 'Commit fresh ZIP outputs on main (manual action only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: xora-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source tests, production build, and ZIP validation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout (do not expose credentials to build scripts)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Ensure extracted repository has tools and tests
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/zip_guard.py
          test -f scripts/verify_repo.py
          test -f tests/test_zip_guard.py
          test -f package.json
          test -f src/app/page.tsx

      - name: Run ZIP extractor and validator unit tests
        run: python -m unittest discover -s tests -p 'test_zip_guard.py' -v

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Verify application security boundaries and tests
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test --test-concurrency=1 tests/*.test.mjs
          node scripts/check-boundaries.mjs

      - name: Install dependencies and compile Next.js without production secrets
        shell: bash
        env:
          XORA_AUTH_ENABLED: 'false'
          XORA_SIGNUP_ENABLED: 'false'
          XORA_PUBLIC_LAUNCH: 'false'
          XORA_MOMO_PAYMENTS: 'false'
          XORA_TEST_ENDPOINTS: 'false'
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --include=dev --no-audit --no-fund
          else
            npm install --include=dev --no-audit --no-fund
          fi
          npm run build

      - name: Normalize each ZIP independently; repository source is authoritative
        shell: bash
        env:
          SELECTED_ARCHIVE: ${{ inputs.archive || '' }}
        run: |
          set -euo pipefail
          args=(--repo . --source-root . --strict-repo-sync --output-dir dist/normalized --report-dir dist/reports)
          if [[ -n "$SELECTED_ARCHIVE" ]]; then
            args+=(--archive "$SELECTED_ARCHIVE")
          fi
          python scripts/zip_guard.py "${args[@]}"

      - name: Validate regenerated ZIP manifests, paths, and content uniqueness
        run: |
          python scripts/verify_repo.py --archive-dir dist/normalized --report dist/reports/repository-validation.json --require-root-layout --no-duplicate-content
          sha256sum dist/normalized/*.validated.zip

      - name: Publish clean ZIPs and reports as Actions artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xora-production-build-${{ github.run_number }}
          path: |
            dist/normalized/*.validated.zip
            dist/reports/*.json
          if-no-files-found: error
          retention-days: 14

  commit-zips:
    name: Refresh generated ZIPs (manual approval only)
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.commit_updated_zips &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: xora-production-build-${{ github.run_number }}
          path: dist/
      - name: Commit generated artifacts only
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- dist/normalized dist/reports
          if git diff --cached --quiet; then
            echo 'Already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh validated ZIP artifacts [skip ci]'
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          
