name: Extract, validate and refresh any ZIP

on:
  push:
    # Runs on any branch; publishing is restricted to the default branch.
    paths-ignore:
      - 'dist/normalized/**'
      - 'dist/reports/**'
  pull_request:
  workflow_dispatch:
    inputs:
      archive:
        description: 'Optional ZIP file path or directory; blank discovers any *.zip / *.ZIP'
        required: false
        type: string
        default: ''
      source_root:
        description: 'Repository source folder: auto, . or XORA_APP'
        required: false
        type: string
        default: auto
      commit_updated_zip:
        description: 'Commit refreshed ZIPs to this repo (default branch only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zip-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-extract:
    name: Validate archives and extracted repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout (read-only, no persisted credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Test extractor and duplicate protection
        run: python -m unittest discover -s tests -p test_zip_guard.py -v

      - name: Extract arbitrary ZIP names and refresh from repo
        shell: bash
        env:
          SELECTED_ARCHIVE: ${{ inputs.archive || '' }}
          SOURCE_ROOT: ${{ inputs.source_root || 'auto' }}
        run: |
          set -euo pipefail
          args=(--repo . --output-dir dist/normalized --report-dir dist/reports --extract-dir dist/extracted --source-root "$SOURCE_ROOT")
          if [[ -n "$SELECTED_ARCHIVE" ]]; then
            args+=(--archive "$SELECTED_ARCHIVE")
          fi
          python tools/zip_guard.py "${args[@]}"

      - name: Validate output ZIP contents, manifests and project structure
        run: python tools/verify_repo.py --archive-dir dist/normalized --report dist/reports/repository-validation.json

      - name: Print output checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum dist/normalized/*.validated.zip
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('dist/reports/repository-validation.json').read_text())
          assert r['passed'], 'ZIP validation did not pass'
          print('All ZIPs passed extracted repository validation')
          PY

      - name: Upload normalized ZIPs and validation reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zip-guard-${{ github.run_number }}
          path: |
            dist/normalized/*.validated.zip
            dist/reports/*.json
          if-no-files-found: error
          retention-days: 14

  commit-refreshed-zips:
    name: Update ZIPs in repo on default branch
    needs: validate-and-extract
    # PRs never write, manual runs only write with explicit opt-in.
    if: >-
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.commit_updated_zip)) &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout default branch for targeted ZIP refresh
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Regenerate only managed ZIP and report outputs
        shell: bash
        env:
          SELECTED_ARCHIVE: ${{ inputs.archive || '' }}
          SOURCE_ROOT: ${{ inputs.source_root || 'auto' }}
        run: |
          set -euo pipefail
          mkdir -p dist/normalized dist/reports
          # Remove stale *generated* filenames when a source ZIP was renamed/deleted.
          find dist/normalized -maxdepth 1 -type f -name '*.validated.zip' -delete
          find dist/reports -maxdepth 1 -type f \( -name '*.report.json' -o -name 'summary.json' -o -name 'repository-validation.json' \) -delete
          args=(--repo . --output-dir dist/normalized --report-dir dist/reports --source-root "$SOURCE_ROOT")
          if [[ -n "$SELECTED_ARCHIVE" ]]; then
            args+=(--archive "$SELECTED_ARCHIVE")
          fi
          python tools/zip_guard.py "${args[@]}"
          python tools/verify_repo.py --archive-dir dist/normalized --report dist/reports/repository-validation.json

      - name: Commit fresh ZIPs only when source content changed
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- dist/normalized dist/reports
          if git diff --cached --quiet; then
            echo 'Already current: no ZIP changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh validated ZIPs [skip ci]'
          # Never force push; branch protection or concurrent changes may block it.
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
