# Example CI for a dedicated XORA-only repo; not yet deployed.
# No Neon credentials required for basic source checks.
name: xora-foundation-ci
on:
  push:
    branches: [main, staging]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run verify:boundaries
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
